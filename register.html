<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reflex - Create Account</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/register.css') }}"
    >

</head>

<body>

    <main class="register-container">

        <div class="register-card">

            <!-- BRAND -->

            <div class="brand">

                <div class="brand-icon">
                    R
                </div>

                <h1>Reflex</h1>

                <p>
                    Delivery Management System
                </p>

            </div>


            <!-- HEADING -->

            <div class="register-heading">

                <h2>
                    Create an account
                </h2>

                <p>
                    Enter your details to get started.
                </p>

            </div>


            <!-- REGISTRATION FORM -->

            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="e.g. John Mwangi"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="e.g. 0712345678"
                        autocomplete="tel"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 6 characters"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- ROLE -->

                <div class="form-group">

                    <label for="role">
                        Select Your Role
                    </label>

                    <select
                        id="role"
                        name="role"
                        required
                    >

                        <option value="">
                            Choose a role
                        </option>

                        <option value="Retailer">
                            Retailer
                        </option>

                        <option value="Dispatcher">
                            Dispatcher
                        </option>

                        <option value="Rider">
                            Rider
                        </option>

                    </select>

                </div>


                <button
                    type="submit"
                    id="registerButton"
                >
                    Create Account
                </button>

            </form>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message"
            ></div>


            <!-- LOGIN LINK -->

            <div class="login-link">

                <span>
                    Already have an account?
                </span>

                <a href="/login">
                    Sign in
                </a>

            </div>


            <!-- FOOTER -->

            <div class="register-footer">

                <p>
                    Reflex Delivery Management System
                </p>

            </div>

        </div>

    </main>


    <script
        src="{{ url_for('static', filename='js/register.js') }}"
    ></script>

</body>

</html>
